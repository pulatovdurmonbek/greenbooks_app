<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GreenBooks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f2f4f7);--tx:var(--tg-theme-text-color,#111);
--hint:var(--tg-theme-hint-color,#8a8f98);--acc:#22a06b;--btn:var(--tg-theme-button-color,#22a06b);--btx:var(--tg-theme-button-text-color,#fff);
--card:var(--tg-theme-section-bg-color,var(--bg2));--line:rgba(127,127,127,.18)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{padding:14px 14px 90px;-webkit-tap-highlight-color:transparent}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:17px;margin:18px 0 10px}
.hint{color:var(--hint);font-size:13px}
.top{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:14px}
.ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#22a06b,#1d7fd6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.chip{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;padding:14px 12px;min-height:86px;cursor:pointer;border:1px solid transparent;transition:.15s}
.tile:active{transform:scale(.97)}.tile b{display:block;font-size:15px;margin-bottom:4px}.tile span{font-size:12px;color:var(--hint);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.wide{grid-column:span 2;background:linear-gradient(135deg,rgba(34,160,107,.18),rgba(29,127,214,.18))}
.list .row{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row small{color:var(--hint)}
textarea,input,select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none}
textarea{min-height:140px;resize:vertical}label{display:block;font-size:13px;color:var(--hint);margin:12px 0 6px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font:600 15px inherit;background:var(--btn);color:var(--btx);margin-top:14px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--tx)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:30%;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 6px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btx);border-color:transparent}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--hint);font:12px inherit;padding:6px 0;cursor:pointer}nav button b{display:block;font-size:20px}
nav button.on{color:var(--acc)}
.back{border:0;background:none;color:var(--acc);font:inherit;padding:0;margin-bottom:8px;cursor:pointer}
.ok{text-align:center;padding:40px 10px}.ok b{font-size:44px;display:block}
.toast{position:fixed;left:14px;right:14px;bottom:80px;background:#222;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9}
</style>
</head>
<body>
<div id="v"></div>
<nav id="nav">
  <button data-t="home" class="on"><b>🏠</b><span data-i="home"></span></button>
  <button data-t="tutor"><b>👨‍🏫</b><span>Ustoz AI</span></button>
  <button data-t="profile"><b>👤</b><span data-i="profile"></span></button>
</nav>
<div class="toast" id="toast"></div>
<script>
const API = "https://zupzvekirthvknydjjga.supabase.co/functions/v1/greenbooks/api/";
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const $ = (s) => document.querySelector(s), V = $("#v");
let ME = null, LANG = "uz";
const I = {
  uz: { home: "Asosiy", profile: "Profil", hello: "Salom", today: "Bugungi AI so'rovlar", send: "Yuborish", sent: "Qabul qilindi! Natija bot chatiga keladi.", toChat: "Botga qaytish",
    back: "← Orqaga", write: "Ma'lumotlarni yozing", openChat: "Bot chatida ochildi", role: "Rolingiz", premium: "Premium", none: "yo'q", newCourse: "➕ Yangi kurs",
    courses: "Kurslaringiz", start: "▶️ Darsni boshlash", subject: "Fan yoki til", tlevel: "Ustoz darajasi", tstyle: "Ustoz fe'li", slevel: "Sizning darajangiz",
    length: "Davomiyligi", tz: "Vaqt mintaqasi", time: "Dars vaqti (bo'sh — o'zim boshlayman)", goal: "Maqsad va ismingiz", create: "Kursni yaratish", err: "Xatolik. Qayta urinib ko'ring.",
    noTg: "Bu sahifa Telegram ichida (GreenBooks bot) ochilishi kerak.", tutorIntro: "Shaxsiy ustoz: reja tuzadi, har kuni dars o'tadi, uy vazifasini tekshiradi va o'tilganlarni eslab qoladi.",
    student: "🎓 Talaba ishlari", studentSub: "Referat, kurs ishi, taqdimot, test" },
  ru: { home: "Главная", profile: "Профиль", hello: "Привет", today: "AI-запросы сегодня", send: "Отправить", sent: "Принято! Результат придёт в чат бота.", toChat: "Вернуться в бот",
    back: "← Назад", write: "Напишите данные", openChat: "Открыто в чате бота", role: "Ваша роль", premium: "Премиум", none: "нет", newCourse: "➕ Новый курс",
    courses: "Ваши курсы", start: "▶️ Начать урок", subject: "Предмет или язык", tlevel: "Уровень учителя", tstyle: "Характер учителя", slevel: "Ваш уровень",
    length: "Длительность", tz: "Часовой пояс", time: "Время урока (пусто — начну сам)", goal: "Цель и ваше имя", create: "Создать курс", err: "Ошибка. Попробуйте ещё раз.",
    noTg: "Откройте эту страницу в Telegram (бот GreenBooks).", tutorIntro: "Личный учитель: план, ежедневные уроки, проверка домашних заданий.",
    student: "🎓 Студенческие работы", studentSub: "Реферат, курсовая, презентация, тест" },
  en: { home: "Home", profile: "Profile", hello: "Hi", today: "AI requests today", send: "Send", sent: "Got it! The result will arrive in the bot chat.", toChat: "Back to bot",
    back: "← Back", write: "Write the details", openChat: "Opened in the bot chat", role: "Your role", premium: "Premium", none: "no", newCourse: "➕ New course",
    courses: "Your courses", start: "▶️ Start lesson", subject: "Subject or language", tlevel: "Teacher level", tstyle: "Teacher character", slevel: "Your level",
    length: "Length", tz: "Time zone", time: "Lesson time (empty — I start myself)", goal: "Goal and your name", create: "Create course", err: "Error. Please try again.",
    noTg: "Open this page inside Telegram (GreenBooks bot).", tutorIntro: "Personal teacher: plan, daily lessons, homework checks, remembers past lessons.",
    student: "🎓 Student papers", studentSub: "Essays, course papers, slides, tests" },
};
const t = (k) => (I[LANG] || I.uz)[k] || I.uz[k] || k;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(m) { const el = $("#toast"); el.textContent = m; el.style.display = "block"; setTimeout(() => el.style.display = "none", 2600); }
async function api(action, body = {}) {
  const r = await fetch(API + action, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ initData: tg?.initData || "", ...body }) });
  const j = await r.json().catch(() => ({ error: "net" }));
  if (j.error) throw new Error(j.error);
  return j;
}
function haptic() { try { tg?.HapticFeedback?.impactOccurred("light"); } catch {} }
function done(msg) {
  V.innerHTML = `<div class="ok"><b>✅</b><h2>${esc(msg)}</h2><button class="btn" onclick="tg?.close()">${t("toChat")}</button><button class="btn ghost" onclick="go('home')">${t("back")}</button></div>`;
  try { tg?.HapticFeedback?.notificationOccurred("success"); } catch {}
}

function home() {
  const p = ME, pct = Math.min(100, Math.round(100 * p.ai_used / Math.max(1, p.ai_limit)));
  V.innerHTML = `<div class="top"><div class="ava">${esc((p.name || "G")[0])}</div><div style="flex:1">
    <h1>${t("hello")}, ${esc(p.name || "")}!</h1>
    <div class="chips"><span class="chip">⭐ Lv ${p.level}</span><span class="chip">${p.premium ? "💎 " + p.premium : "Free"}</span></div>
    <div class="hint" style="margin-top:6px">${t("today")}: ${p.ai_used}/${p.ai_limit}</div><div class="bar"><i style="width:${pct}%"></i></div></div></div>
    <h2>GreenBooks</h2><div class="grid">
    <div class="tile wide" onclick="go('tutor')"><b>👨‍🏫 Ustoz AI</b><span>${t("tutorIntro")}</span></div>
    <div class="tile" onclick="link('student')"><b>${t("student")}</b><span>${t("studentSub")}</span></div>
    ${p.sections.map((s) => `<div class="tile" onclick="section('${s.key}')"><b>${esc(s.title)}</b><span>${esc(s.intro)}</span></div>`).join("")}
    </div>`;
}
function section(key) {
  haptic();
  const s = ME.sections.find((x) => x.key === key);
  const tools = ME.tools.filter((x) => x.sec === key);
  V.innerHTML = `<button class="back" onclick="go('home')">${t("back")}</button><h1>${esc(s.title)}</h1><p class="hint">${esc(s.intro)}</p>
    <div class="list">${tools.map((x) => `<div class="row" onclick="tool('${x.id}')"><span>${esc(x.title)}</span><small>${x.kind === "doc" ? "Word+PDF" : x.kind === "link" ? "↗" : "💬"}</small></div>`).join("")}</div>`;
}
async function link(key) {
  haptic();
  try { await api("link", { key }); done(t("openChat")); } catch { toast(t("err")); }
}
function tool(id) {
  haptic();
  const x = ME.tools.find((y) => y.id === id);
  if (x.kind === "link") return link(x.link);
  V.innerHTML = `<button class="back" onclick="section('${x.sec}')">${t("back")}</button><h1>${esc(x.title)}</h1>
    <label>${t("write")}</label><textarea id="tx" placeholder="${esc(x.hint)}"></textarea>
    <button class="btn" id="sb">${t("send")}</button>`;
  $("#sb").onclick = async () => {
    const text = $("#tx").value.trim();
    if (text.length < 2) return $("#tx").focus();
    $("#sb").disabled = true;
    try { await api("tool", { tool: id, text }); done(t("sent")); } catch { $("#sb").disabled = false; toast(t("err")); }
  };
}
const SEG = (name, opts, val) => `<div class="seg" data-n="${name}">${opts.map(([v, l]) => `<button data-v="${v}" class="${v === val ? "on" : ""}">${l}</button>`).join("")}</div>`;
function tutor() {
  const cs = ME.courses || [];
  V.innerHTML = `<h1>👨‍🏫 Ustoz AI</h1><p class="hint">${t("tutorIntro")}</p>
    ${cs.length ? `<h2>${t("courses")}</h2><div class="list">${cs.map((c) => `<div class="row" onclick="startLesson(${c.id})"><span>${esc(c.subject)}<br><small>${c.day_index}/${c.total || "…"} · ${c.lesson_time || "—"}</small></span><small>${t("start")}</small></div>`).join("")}</div>` : ""}
    <h2>${t("newCourse")}</h2>
    <label>${t("subject")}</label><input id="subj" list="subjs" placeholder="Ingliz tili"><datalist id="subjs">${["Ingliz tili","Rus tili","Koreys tili","Nemis tili","Matematika","Fizika","Kimyo","Biologiya","Tarix","Ona tili va adabiyot","Dasturlash"].map((x) => `<option value="${x}">`).join("")}</datalist>
    <label>${t("tlevel")}</label>${SEG("teacher_level", [["simple", "🙂 Oddiy"], ["pro", "🎓 Professional"], ["genius", "🧠 Geniy"]], "pro")}
    <label>${t("tstyle")}</label>${SEG("teacher_style", [["kind", "😊 Hushmuomala"], ["demanding", "📏 Talabchan"], ["strict", "⚡ Qattiqqul"]], "kind")}
    <label>${t("slevel")}</label>${SEG("student_level", [["zero", "🌱 Noldan"], ["mid", "🌿 O'rtacha"], ["good", "🌳 Yaxshi"]], "zero")}
    <label>${t("length")}</label>${SEG("lessons", [["7", "1 hafta"], ["26", "1 oy"], ["60", "3 oy"]], "26")}
    <label>${t("tz")}</label>${SEG("tz", [["Asia/Tashkent", "🇺🇿 Toshkent"], ["Asia/Seoul", "🇰🇷 Seul"], ["Europe/Moscow", "🇷🇺 Moskva"]], "Asia/Tashkent")}
    <label>${t("time")}</label><input id="tm" type="time" step="900">
    <label>${t("goal")}</label><textarea id="goal" style="min-height:80px" placeholder="IELTS 6.5 · Durmonbek"></textarea>
    <button class="btn" id="cb">${t("create")}</button>`;
  document.querySelectorAll(".seg").forEach((sg) => sg.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return; haptic();
    sg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  });
  $("#cb").onclick = async () => {
    const v = (n) => document.querySelector(`.seg[data-n="${n}"] .on`)?.dataset.v;
    $("#cb").disabled = true;
    try {
      await api("tutor_new", { subject: $("#subj").value || "Ingliz tili", teacher_level: v("teacher_level"), teacher_style: v("teacher_style"),
        student_level: v("student_level"), lessons: v("lessons"), tz: v("tz"), lesson_time: $("#tm").value || null, goal: $("#goal").value });
      done(t("sent"));
    } catch { $("#cb").disabled = false; toast(t("err")); }
  };
}
async function startLesson(id) {
  haptic();
  try { await api("tutor_start", { course_id: id }); done(t("openChat")); } catch { toast(t("err")); }
}
function profile() {
  const roles = [["student", "🎓 Talaba"], ["applicant", "📝 Abituriyent"], ["teacher", "👩‍🏫 O'qituvchi"], ["user", "👤 Boshqa"]];
  V.innerHTML = `<div class="top"><div class="ava">${esc((ME.name || "G")[0])}</div><div><h1>${esc(ME.name || "")}</h1>
    <div class="hint">${t("premium")}: ${ME.premium ? "💎 " + ME.premium : t("none")} · ⭐ Lv ${ME.level} · ${ME.xp} XP</div></div></div>
    <label>${t("role")}</label>${SEG("role", roles, ME.role)}
    <button class="btn ghost" onclick="link('premium')">💎 Premium</button>
    <button class="btn ghost" onclick="link('help')">ℹ️ Yordam</button>`;
  document.querySelector(".seg").onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll(".seg button").forEach((x) => x.classList.toggle("on", x === b));
    try { await api("role", { role: b.dataset.v }); ME.role = b.dataset.v; toast("✅"); } catch { toast(t("err")); }
  };
}
function go(tab) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab));
  ({ home, tutor, profile })[tab]();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { haptic(); go(b.dataset.t); });
(async () => {
  if (!tg?.initData) { V.innerHTML = `<div class="ok"><b>📗</b><h2>GreenBooks</h2><p class="hint">${I.uz.noTg}</p></div>`; return; }
  V.innerHTML = `<div class="ok"><b>📗</b><p class="hint">…</p></div>`;
  try {
    ME = await api("me");
    LANG = ME.lang || "uz";
    document.querySelectorAll("[data-i]").forEach((el) => el.textContent = t(el.dataset.i));
    go("home");
  } catch (e) { V.innerHTML = `<div class="ok"><b>⚠️</b><h2>${t("err")}</h2><button class="btn" onclick="location.reload()">↻</button></div>`; }
})();
</script>
</body>
</html>
