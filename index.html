    const fresh = await api("me");
    try { localStorage.setItem(CK, JSON.stringify(fresh)); } catch {}
    const onHome = !shown || document.querySelector("nav button.on")?.dataset.t === "home";
    const onTutor = document.querySelector("nav button.on")?.dataset.t === "tutor" && !L.ws && !document.getElementById("subj")?.value;
    apply(fresh);
    if (CALL) { if (!shown) incoming(CALL); }
    else if (onHome && !document.querySelector(".back")) go("home"); else if (onTutor) go("tutor");
  } catch (e) { if (!shown) V.innerHTML = `<div class="ok"><b>⚠️</b><h2>${t("err")}</h2><button class="btn" onclick="location.reload()">↻</button></div>`; }
})();
</script>
</body>
</html>
