.tile{background:var(--card);border-radius:16px;padding:14px 12px;min-height:86px;cursor:pointer;border:1px solid transparent;transition:.15s}
.tile:active{transform:scale(.97)}.tile b{display:block;font-size:15px;margin-bottom:4px}.tile span{font-size:12px;color:var(--hint);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.toast{position:fixed;left:14px;right:14px;bottom:80px;background:#222;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9}
</style>

const t = (k) => (I[LANG] || I.uz)[k] || I.uz[k] || k;

async function api(action, body = {}) {

  if (j.error) { const e = new Error(j.error); e.detail = j.detail || ""; throw e; }
  return j;
}

}

    else if (onHome && !document.querySelector(".back")) go("home"); else if (onTutor) go("tutor");
  } catch (e) { if (!shown) V.innerHTML = `<div class="ok"><b>⚠️</b><h2>${t("err")}</h2><button class="btn" onclick="location.reload()">↻</button></div>`; }
})();
</script>
</body>
</html>
